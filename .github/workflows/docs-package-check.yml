name: Docs Package Check

on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'

            - name: Install pnpm
              run: npm install -g pnpm@10.34.4

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Check published package versions
              id: package-check
              env:
                  DOCS_PACKAGE_RESULT: ${{ runner.temp }}/pr-docs-packages.json
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -o pipefail
                  bash docs/release/check-packages.sh warn docs docs/release/package-catalog.txt 2>&1 | tee "$RUNNER_TEMP/docs-package-check.log"

            - name: Upload package version results
              if: ${{ steps.package-check.outcome == 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: pr-summary-docs-packages
                  path: ${{ runner.temp }}/pr-docs-packages.json
                  retention-days: 30